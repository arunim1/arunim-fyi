      "decryptionPassword",
      sodium.to_base64(mk, sodium.base64_variants.ORIGINAL)

    localStorage.setItem("decryptionPasswordTimestamp", Date.now().toString());

    if (mk) return mk;

    if (!passphrase) return null;

    const KEK = await deriveKEK(passphrase);
    mk = unwrapMasterKey(KEK);
    if (mk) storeMasterKey(mk);
    return mk;

    div.textContent = "Looks like that key has expired or is invalid — consider asking me for access again. Keys expire and rotate every couple of months.";

  // The locked placeholder carries a .pw-form; one delegated handler serves

    const form = e.target;

    const status = form.parentElement.querySelector(".pw-status");

      status.textContent = text;
      status.classList.toggle("pw-error", !!isError);

      const KEK = await deriveKEK(passphrase);

      storeMasterKey(mk);
      setStatus("", false);

  function showSharePopup(slug, pageKey) {

    overlay.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9999;display:flex;align-items:center;justify-content:center;";

      }

      setTimeout(() => overlay.remove(), 900);
    });
    document.body.appendChild(overlay);
  }

  // Resolve + decrypt every sealed article. Per article, keys are tried in
  // order: master-key unwrap of data-wk (friends), stored grant for its slug,
  // then the #k= fragment (first visit via a share link).
  async function decryptVisibleArticles(forceRegenerate) {
    await ready();
    const mk = await authenticateAndGetMasterKey(forceRegenerate);

    let any = false;
    let masterFailed = false;
    const decryptedArticles = [];
    document.querySelectorAll("article.encrypted").forEach((article) => {
      const blobEl = article.querySelector(".encrypted-content");
      if (!blobEl) return;
      const blob = (blobEl.textContent || "").trim();
      if (!blob) return;
      const slug = article.getAttribute("data-slug");
      const wk = article.getAttribute("data-wk");

      let plain = null;
      let usedKey = null;
      let viaMaster = false;

      // 1. Friend path: unwrap this page's key with the master key.
      if (mk && wk) {
        try {
          const pageKey = aeadOpen(wk, mk);
          plain = aeadOpen(blob, pageKey);
          usedKey = pageKey;
          viaMaster = true;
        } catch (_) {
          // Master key stale (rotated) — caller may retry with forceRegenerate.
          masterFailed = true;
        }
      }

      // 2. Stored grant from a past share link.
      if (!plain && slug) {
        const grants = loadGrants();
        if (grants[slug]) {
          try {
            const k = sodium.from_base64(grants[slug], sodium.base64_variants.URLSAFE_NO_PADDING);
            plain = aeadOpen(blob, k);
            usedKey = k;
          } catch (_) {
            // Grant went stale (epoch rollover / revoke) — prune + explain.
            delete grants[slug];
            saveGrants(grants);
            showExpiredMessage(article);
          }
        }
      }

      // 3. First visit via a share link: the fragment IS the page key.
      if (!plain && fragmentKeyB64) {
        const k = fragmentKeyBytes();
        if (k) {
          try {
            plain = aeadOpen(blob, k);
            usedKey = k;
            if (slug) {
              const grants = loadGrants();
              grants[slug] = fragmentKeyB64;
              saveGrants(grants);
            }
            stripFragment();
          } catch (_) {
            showExpiredMessage(article);
          }
        } else {
          showExpiredMessage(article);
        }
      }

      if (!plain) return;
      article.innerHTML = sodium.to_string(plain);
      article.classList.remove("encrypted");
      article.classList.add("decrypted");
      // Passphrase holders can mint links; share-link visitors cannot
      // (one degree of sharing).
      if (viaMaster) injectShareButton(article, usedKey);
      decryptedArticles.push(article);
      any = true;
      // Consume the fragment on ANY successful decrypt — a logged-in friend
      // opening a share link would otherwise keep a live page key sitting in
      // their address bar, exactly the copy/paste leak the strip exists to
      // prevent (review finding #6).
      if (fragmentKeyB64) stripFragment();
    });

    // After unsealing pages, decrypt ".enc" asset refs with the per-asset
    // keys embedded inside each page's sealed body. Fire and forget — images
    // appear progressively as fetches return.
    for (const article of decryptedArticles) {
      decryptAssetRefsIn(article, readAssetKeys(article)).catch(() => {});
    }
    // Signal a retry only when the master path specifically looks stale.
    return any || !masterFailed;
  }

  // Inlined here (rather than imported) so the IIFE is self-sufficient and
  // doesn't depend on postscript.js bundle order.
  const ASSET_MIME = {
    png: "image/png", jpg: "image/jpeg", jpeg: "image/jpeg", gif: "image/gif",
    webp: "image/webp", svg: "image/svg+xml", bmp: "image/bmp",
    pdf: "application/pdf",
    mp4: "video/mp4", webm: "video/webm", mov: "video/quicktime",
    mp3: "audio/mpeg", wav: "audio/wav", ogg: "audio/ogg", m4a: "audio/mp4",
  };
  const ENC_SELECTORS = 'img[src$=".enc"],video[src$=".enc"],audio[src$=".enc"],source[src$=".enc"],iframe[src$=".enc"],a[href$=".enc"]';

  function mimeFromUrl(url) {
    const ext = url.split("?")[0].split("#")[0].toLowerCase().split(".").slice(-1)[0];
    return ASSET_MIME[ext] || "application/octet-stream";
  }

  // Per-asset keys ride inside each page's sealed body as a JSON map keyed by
  // "assets/<name>.enc" (see the build emitter). Read it post-decrypt.
  function readAssetKeys(root) {
    const el = root.querySelector("script.asset-keys");
    if (!el) return {};
    try { return JSON.parse(el.textContent || "{}"); } catch (_) { return {}; }
  }

  function assetKeyForUrl(assetKeys, rawUrl) {
    const m = rawUrl.match(/assets\/.+\.enc$/);
    if (!m) return null;
    const b64 = assetKeys[m[0]];
    if (!b64) return null;
    try { return sodium.from_base64(b64, sodium.base64_variants.ORIGINAL); }
    catch (_) { return null; }
  }

  async function decryptAssetRefsIn(root, assetKeys) {
    if (!window.__quartzAssetCache) window.__quartzAssetCache = new Map();
    const cache = window.__quartzAssetCache;
    const els = root.querySelectorAll(ENC_SELECTORS);
    await Promise.all(Array.from(els).map(async (el) => {
      const attr = el.tagName === "A" ? "href" : "src";
      const raw = el.getAttribute(attr);
      if (!raw) return;
      const cached = cache.get(raw);
      if (cached) { el.setAttribute(attr, cached); return; }
      const assetKey = assetKeyForUrl(assetKeys, raw);
